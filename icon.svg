<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041633"/>
      <stop offset=".55" stop-color="#04528f"/>
      <stop offset="1" stop-color="#007d72"/>
    </linearGradient>
    <linearGradient id="personA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7f2ff"/>
      <stop offset="1" stop-color="#1596e8"/>
