name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Generate icon sizes from selected master
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open("app-icon-master-v45.png").convert("RGB")
          for size in (64, 180, 192, 512):
              out = src.resize((size, size), Image.Resampling.LANCZOS)
              path = f"icon-{size}.png"
              out.save(path, "PNG", optimize=True)
              verify = Image.open(path)
              verify.load()
              assert verify.size == (size, size)
              print(f"Generated {path}: {verify.size}")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
