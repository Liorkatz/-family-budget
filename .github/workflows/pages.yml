name: Deploy static content to Pages
# redeploy marker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare minimal site artifact
        run: |
          mkdir -p _site
          cp index.html app.js styles.css config.js manifest.webmanifest icon-180-v48.png money.html money.css money.js money2.html money2.css money2.js money3.html money3.css money3.js money-live.html money-live.css money-live.js money-3d-test.html money-3d-test.js _site/
          base64 -d money-bg-blue.jpg.b64 > _site/money-bg-blue.jpg
          base64 -d money-live-scene.jpg.b64 > _site/money-live-scene.jpg
          base64 -d banknotes-source.jpg.b64 > _site/banknotes-source.jpg
          base64 -d money-mountain-base.jpg.b64 > _site/money-mountain-base.jpg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
