name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Generate PWA icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter

          S = 512
          img = Image.new("RGB", (S, S), "#061425")
          px = img.load()

          # Full-bleed navy -> teal background.
          for y in range(S):
              for x in range(S):
                  tx = x / (S - 1)
                  ty = y / (S - 1)
                  # dark navy base with cyan/green lift to top-right
                  r = int(4 + 2*tx + 0*ty)
                  g = int(20 + 42*tx + 10*(1-ty))
                  b = int(37 + 44*(1-tx) + 18*(1-ty))
                  px[x, y] = (min(r,255), min(g,255), min(b,255))

          # Soft neon glows.
          glow = Image.new("RGBA", (S, S), (0,0,0,0))
          gd = ImageDraw.Draw(glow)
          gd.ellipse((260,-80,620,280), fill=(0,255,170,85))
          gd.ellipse((-120,-70,260,300), fill=(0,130,255,75))
          gd.ellipse((120,300,560,650), fill=(0,220,190,55))
          glow = glow.filter(ImageFilter.GaussianBlur(75))
          img = Image.alpha_composite(img.convert("RGBA"), glow)

          art = Image.new("RGBA", (S, S), (0,0,0,0))
          d = ImageDraw.Draw(art)

          # Family silhouettes.
          # Adult
          d.ellipse((288,62,438,212), fill=(60,244,205,255), outline=(214,255,246,255), width=9)
          d.rounded_rectangle((244,194,455,372), radius=90, fill=(20,188,186,255), outline=(160,255,232,230), width=8)
          # Child
          d.ellipse((135,157,238,260), fill=(43,176,255,255), outline=(220,248,255,255), width=8)
          d.rounded_rectangle((101,242,278,390), radius=73, fill=(24,123,223,255), outline=(153,225,255,220), width=7)

          # Curved "embrace" ribbon.
          d.line([(388,242),(338,290),(278,329),(226,352)], fill=(41,222,217,255), width=42, joint="curve")

          # Coin stacks - left small, right tall.
          def coin_stack(cx, y_bottom, width, layers, h, gap, body, top, edge):
              for i in range(layers):
                  y = y_bottom - i*(h+gap)
                  x0 = cx - width//2
                  x1 = cx + width//2
                  # body
                  d.rounded_rectangle((x0, y-h, x1, y), radius=h//2, fill=body, outline=edge, width=5)
                  # top lip
                  d.ellipse((x0, y-h-10, x1, y-h+16), fill=top, outline=(225,255,248,255), width=5)

          coin_stack(178, 445, 170, 2, 46, 10, (24,159,205,255), (74,235,205,255), (93,238,255,255))
          coin_stack(350, 456, 192, 4, 43, 7, (17,174,139,255), (91,236,175,255), (184,255,221,255))

          # Highlights.
          hi = Image.new("RGBA", (S,S), (0,0,0,0))
          hd = ImageDraw.Draw(hi)
          hd.arc((294,66,432,204), 205, 305, fill=(255,255,255,180), width=10)
          hd.arc((142,163,233,254), 205, 305, fill=(255,255,255,170), width=8)
          hd.arc((106,248,275,386), 190, 275, fill=(255,255,255,90), width=7)
          art = Image.alpha_composite(art, hi.filter(ImageFilter.GaussianBlur(1.2)))

          # Neon glow behind art.
          blurred = art.filter(ImageFilter.GaussianBlur(18))
          img = Image.alpha_composite(img, blurred)
          img = Image.alpha_composite(img, art).convert("RGB")

          for size in (180, 192, 512):
              out = img.resize((size, size), Image.Resampling.LANCZOS)
              out.save(f"icon-{size}.png", "PNG", optimize=True)
              chk = Image.open(f"icon-{size}.png")
              chk.load()
              assert chk.size == (size, size)
              print(f"Generated valid icon-{size}.png")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
